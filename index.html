<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAMZA FOREX BOT</title>
<style>
  body { margin:0; font-family:Arial,sans-serif; background:#0f172a; color:#e2e8f0; text-align:center; padding:20px; }
  h1 { font-size:22px; margin:10px 0 4px; }
  .sub { color:#94a3b8; font-size:14px; margin-bottom:20px; }
  .card { max-width:420px; margin:0 auto; background:#1e293b; border-radius:16px; padding:24px; }
  #signal { font-size:48px; font-weight:bold; margin:10px 0; }
  .BUY { color:#22c55e; }
  .SELL { color:#ef4444; }
  .WAITING { color:#eab308; }
  .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #334155; font-size:15px; }
  button { margin-top:18px; padding:12px 24px; font-size:16px; border:0; border-radius:10px; background:#3b82f6; color:#fff; }
  .note { margin-top:18px; font-size:12px; color:#94a3b8; }
  #status { margin-top:12px; font-size:13px; color:#94a3b8; }
</style>
</head>
<body>
  <h1>HAMZA FOREX BOT</h1>
  <div class="sub">EUR/USD · فريم 5 دقائق · EMA 9 / EMA 21</div>

  <div class="card">
    <div id="signal" class="WAITING">...</div>
    <div class="row"><span>السعر</span><span id="price">-</span></div>
    <div class="row"><span>EMA 9</span><span id="ema9">-</span></div>
    <div class="row"><span>EMA 21</span><span id="ema21">-</span></div>
    <div class="row"><span>وقت آخر شمعة (UTC)</span><span id="candle">-</span></div>
    <button onclick="loadSignal()">تحديث الآن</button>
    <div id="status">جاري التحميل...</div>
  </div>

  <div class="note">⚠️ هذه إشارات للتجربة فقط وليست نصيحة مالية. لا تضمن أرباحاً.</div>

<script>
  const API_URL = "https://hamza-forex-bot.hamzaofisyal199.workers.dev";

  async function loadSignal() {
    const status = document.getElementById("status");
    status.textContent = "جاري التحديث...";
    try {
      const res = await fetch(API_URL);
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || "خطأ غير معروف");

      const s = document.getElementById("signal");
      s.textContent = d.signal;
      s.className = d.signal;

      document.getElementById("price").textContent = d.price;
      document.getElementById("ema9").textContent = d.ema9;
      document.getElementById("ema21").textContent = d.ema21;
      document.getElementById("candle").textContent = d.candleTime;
      status.textContent = "آخر تحديث: " + new Date().toLocaleTimeString();
    } catch (e) {
      status.textContent = "تعذر الاتصال: " + e.message;
    }
  }

  loadSignal();
  setInterval(loadSignal, 300000);
</script>
</body>
</html>
